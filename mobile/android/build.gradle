// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Native Voice-Motor (intern/docs/UEBERGABE-MOBILE-VOICE-NATIV.md): das
        // LiveKit-Android-SDK ist Kotlin-basiert — ein Gradle-Modul (VoiceEngine.kt),
        // der Rest des Projekts bleibt Java.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // LiveKit-SDK 2.29.0 zieht seine AudioSwitch-Fork
        // (com.github.davidliu:audioswitch) über JitPack — laut dessen POM die
        // einzige Abhängigkeit, die nicht auf Maven Central liegt. JitPack nur
        // für diese Gruppe, damit kein anderes Artefakt von dort aufgelöst wird.
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup 'com.github.davidliu'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
